<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Todo - Thực hành GitHub Pages</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <h1>Danh Sách Việc Cần Học</h1>
    <p class="subtitle">Lưu tự động trên trình duyệt bằng LocalStorage</p>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Nhập nội dung cần học hoặc ôn tập..."
        required
      />
      <button type="submit">Thêm</button>
    </form>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">Tất cả</button>
      <button type="button" class="filter-btn" data-filter="active">Chưa xong</button>
      <button type="button" class="filter-btn" data-filter="completed">Đã xong</button>
    </div>

    <button type="button" id="clear-completed-btn" class="clear-completed-btn">Xóa việc đã xong</button>
    <ul id="todo-list" class="todo-list"></ul>
    <p id="task-counter">Đang thử tính năng đếm việc</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
